spring.application.name=expense.proj

# H2 Database
spring.datasource.url=jdbc:h2:mem:expenses
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only signing key. Set JWT_SECRET to a private random value outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-expense-tracker-signing-key-change-before-deployment}
app.jwt.expiration-seconds=3600
